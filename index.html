<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Öffne Obsidian …</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#F2F4F8;color:#17202C}
@media (prefers-color-scheme:dark){body{background:#0E131A;color:#E7ECF3}}
main{text-align:center;padding:24px;max-width:28em}
a{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:#7C3AED;color:#fff;text-decoration:none;font-weight:700}
p{opacity:.75}
</style>
</head>
<body>
<main>
<h1 id="t">Öffne Obsidian …</h1>
<p id="f"></p>
<a id="go" href="#">In Obsidian öffnen</a>
<p>Falls nichts passiert: auf den Knopf tippen und „Öffnen“ bestätigen.</p>
</main>
<script>
var q = new URLSearchParams(location.search);
var file = q.get("file") || "00_Start";
var url = "obsidian://open?vault=Studium&file=" + encodeURIComponent(file);
document.getElementById("go").href = url;
document.getElementById("f").textContent = file.split("/").pop();
location.href = url;
</script>
</body>
</html>
